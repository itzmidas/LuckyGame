<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A26"/>
      <stop offset="100%" stop-color="#08080C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE680"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="14"/>

  <!-- Inner Decorative Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-dasharray="14 10" opacity="0.8"/>

  <!-- Lucky Shamrock / Clover Icon -->
  <g fill="url(#goldGrad)" transform="translate(256, 240)">
    <!-- Top Leaf -->
    <path d="M 0 0 C -45 -70 -45 -130 0 -130 C 45 -130 45 -70 0 0"/>
    <!-- Bottom Leaf -->
    <path d="M 0 0 C -45 70 -45 130 0 130 C 45 130 45 70 0 0"/>
    <!-- Left Leaf -->
    <path d="M 0 0 C -70 -45 -130 -45 -130 0 C -130 45 -70 45 0 0"/>
    <!-- Right Leaf -->
    <path d="M 0 0 C 70 -45 130 -45 130 0 C 130 45 70 45 0 0"/>
    <!-- Center Sparkle / Gem -->
    <circle cx="0" cy="0" r="20" fill="#FFFFFF" opacity="0.95"/>
    <!-- Stem -->
    <path d="M 0 30 Q 15 90 35 110 Q 20 115 -5 40 Z" fill="url(#goldGrad)"/>
  </g>
</svg>
